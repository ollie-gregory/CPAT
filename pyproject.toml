[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpat"
version = "0.1.0"
description = "Credit Portfolio Analysis Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
docs = ["pdoc"]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
