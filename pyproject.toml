[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpat"
version = "0.1.0"
description = "Credit Portfolio Analysis Tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
